spring.application.name=demo

# CORS: origins allowed to call the backend (comma-separated).
# Angular dev server defaults to http://localhost:4200.
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200

# No database is configured yet; the supplement API serves in-memory test data only.
# Disable DataSource/JPA auto-configuration so the app (and @SpringBootTest) can boot without a DB.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration

# Spring AI (Anthropic) — API key via environment variable; not committed.
# The app boots without it; the key is only needed when the AG-UI analyze endpoint calls the model.
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
